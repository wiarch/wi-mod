# En cada push a main: build web + compila el escritorio y publica el .exe.
# La landing baja https://github.com/wiarch/wi-mod/releases/latest/download/wi-mod-windows.exe

name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_compile:
        description: "Forzar compilación desktop aunque no cambie la versión"
        required: false
        type: boolean
        default: false
      publish_web:
        description: "Desplegar frontend en gh-pages"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag del release si fuerzas compile (ej. v0.7.5). Vacío = package.json"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_compile: ${{ steps.meta.outputs.should_compile }}
      should_web: ${{ steps.meta.outputs.should_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + flags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          SHOULD_COMPILE=false
          SHOULD_WEB=false

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            SHOULD_COMPILE=true
            SHOULD_WEB=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.tag }}" ]]; then
              TAG="${{ inputs.tag }}"
              VER="${TAG#v}"
            fi
            SHOULD_WEB="${{ inputs.publish_web }}"
            if [[ "${{ inputs.force_compile }}" == "true" ]]; then
              SHOULD_COMPILE=true
            fi
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            SHOULD_WEB=true
            SHOULD_COMPILE=true
            echo "Push a main → compilar escritorio (${VER})"
          fi

          {
            echo "version=${VER}"
            echo "tag=${TAG}"
            echo "should_compile=${SHOULD_COMPILE}"
            echo "should_web=${SHOULD_WEB}"
          } >> "$GITHUB_OUTPUT"

          echo "→ version=${VER} tag=${TAG} compile=${SHOULD_COMPILE} web=${SHOULD_WEB}"

  deploy-web:
    name: Deploy web (gh-pages)
    needs: detect
    if: needs.detect.outputs.should_web == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Deploy dist/ → gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy web ${{ github.sha }} (v${{ needs.detect.outputs.version }})"

  publish-tauri:
    name: Desktop (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.should_compile == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKitGTK deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Build + upload Tauri artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          releaseName: "wi-mod ${{ needs.detect.outputs.tag }}"
          releaseBody: |
            ## wi-mod ${{ needs.detect.outputs.tag }}

            Portable desktop builds (Tauri v2).

            - **Windows:** instalador NSIS (`.exe`) + binario plano
            - **Linux:** AppImage (+ deb/rpm si se generan)
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
          includeRelease: true
          includeDebug: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: [detect, publish-tauri]
    if: needs.detect.outputs.should_compile == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft + create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
          mkdir -p /tmp/rel
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*x64-setup.exe" --dir /tmp/rel
          setup=$(ls /tmp/rel/*x64-setup.exe | head -n 1)
          cp "$setup" /tmp/rel/wi-mod-windows.exe
          gh release upload "$TAG" /tmp/rel/wi-mod-windows.exe --clobber --repo "${{ github.repository }}"
          echo "Published $TAG"
