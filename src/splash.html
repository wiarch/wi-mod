<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>wi-mod</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151b26 !important;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #f3f4f6;
      user-select: none;
    }
    .splash {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(34, 211, 238, 0.08) 0%, transparent 55%);
    }
    .watermark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0.03;
      color: #a5f3fc;
    }
    .watermark svg {
      width: 400px;
      height: 400px;
      transform: scale(2.8);
    }
    .stack {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    .logo {
      width: 80px;
      height: 80px;
      color: #22d3ee;
      filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.7));
      flex: 0 0 auto;
    }
    .title {
      margin: 0;
      font-size: 3.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .wi { color: #fff; }
    .mod {
      color: #22d3ee;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.6));
    }
    .bar {
      box-sizing: border-box;
      width: 400px;
      height: 10px;
      margin-bottom: 20px;
      padding: 2px;
      border-radius: 999px;
      border: 1px solid rgba(6, 182, 212, 0.4);
      background: transparent;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
      overflow: hidden;
    }
    .fill {
      display: block;
      height: 100%;
      width: 8%;
      border-radius: 999px;
      background: #22d3ee;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.9);
      transition: width 0.3s ease;
      animation: progress 2.8s ease-out forwards;
    }
    .line {
      margin: 4px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9ca3af;
    }
    @keyframes progress {
      to { width: 88%; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="glow" aria-hidden="true"></div>
    <div class="watermark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M6 16L24 6L42 16V32L24 42L6 32V16Z" stroke="currentColor" stroke-width="1"/>
        <path d="M6 16L16 34L24 20L32 34L42 16" stroke="currentColor" stroke-width="1"/>
        <path d="M16 34L24 42L32 34" stroke="currentColor" stroke-width="1"/>
        <path d="M14 11L24 28L34 11" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>
    <div class="stack">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 16L24 6L42 16V32L24 42L6 32V16Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M6 16L16 34L24 20L32 34L42 16" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M16 34L24 42L32 34" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M14 11L24 28L34 11" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
        <h1 class="title"><span class="wi">wi-</span><span class="mod">mod</span></h1>
      </div>
      <div class="bar" aria-hidden="true"><span class="fill"></span></div>
      <p class="line">contando escamas…</p>
    </div>
  </div>
  <script type="module" src="./splash.js"></script>
</body>
</html>
